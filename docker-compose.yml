services:
  postgres:
    image: postgres:16-alpine
    container_name: rentals-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentals
      POSTGRES_PASSWORD: rentals
      POSTGRES_DB: rentals_dev
    # Bound to 127.0.0.1, never 0.0.0.0. A bare "5434:5432" publishes on every
    # interface, so anyone on the same network (café wifi, shared office LAN)
    # could reach this database with the credentials sitting right above. Note
    # a host firewall does NOT save you here: Docker writes its own iptables
    # rules that bypass ufw.
    #
    # 5434 rather than the default 5432 because another project on this
    # machine already binds 5432; remapping lets both run at once.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rentals -d rentals_dev]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: rentals-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentals
      POSTGRES_PASSWORD: rentals
      POSTGRES_DB: rentals_test
    # Loopback only — see the note on the dev database above.
    ports:
      - "127.0.0.1:5433:5432"
    # No named volume — test DB is disposable and gets wiped/reset between runs.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rentals -d rentals_test]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentals-redis-dev
    restart: unless-stopped
    # Loopback only. Redis matters even more than Postgres here: it has no
    # authentication configured at all, so publishing it on 0.0.0.0 hands
    # full read/write access to anyone who can route to this host.
    #
    # 6380 rather than 6379 for the same port-clash reason as Postgres.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
