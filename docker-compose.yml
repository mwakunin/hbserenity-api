services:
  postgres:
    image: postgres:16-alpine
    container_name: rentals-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentals
      POSTGRES_PASSWORD: rentals
      POSTGRES_DB: rentals_dev
    # 5434, not the default 5432 — another project on this machine already
    # binds 5432, and remapping here lets both run at once.
    ports:
      - "5434:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rentals -d rentals_dev]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: rentals-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentals
      POSTGRES_PASSWORD: rentals
      POSTGRES_DB: rentals_test
    ports:
      - "5433:5432"
    # No named volume — test DB is disposable and gets wiped/reset between runs.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U rentals -d rentals_test]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rentals-redis-dev
    restart: unless-stopped
    # 6380 for the same reason as Postgres above.
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
